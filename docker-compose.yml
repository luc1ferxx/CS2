services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cs2coach}
      POSTGRES_USER: ${POSTGRES_USER:-cs2coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs2coach}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cs2coach} -d ${POSTGRES_DB:-cs2coach}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://cs2coach:cs2coach@postgres:5432/cs2coach}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_QUEUE_NAME: ${REDIS_QUEUE_NAME:-cs2-demo-jobs}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      AUTH_MODE: ${AUTH_MODE:-development}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-steam}
      STEAM_AUTH_STATE_COOKIE_NAME: ${STEAM_AUTH_STATE_COOKIE_NAME:-__Host-cs2_steam_state}
      STEAM_OPENID_NONCE_TTL_SECONDS: ${STEAM_OPENID_NONCE_TTL_SECONDS:-600}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      STEAM_CREDENTIAL_ENCRYPTION_KEY: ${STEAM_CREDENTIAL_ENCRYPTION_KEY:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
      STEAM_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${STEAM_CREDENTIAL_ENCRYPTION_KEY_VERSION:-dev-v1}
      STEAM_SYNC_MAX_MATCHES: ${STEAM_SYNC_MAX_MATCHES:-20}
      STEAM_SYNC_TIMEOUT_SECONDS: ${STEAM_SYNC_TIMEOUT_SECONDS:-5}
      STEAM_SYNC_RETRY_BASE_SECONDS: ${STEAM_SYNC_RETRY_BASE_SECONDS:-30}
      STEAM_SYNC_RETRY_MAX_SECONDS: ${STEAM_SYNC_RETRY_MAX_SECONDS:-3600}
      STEAM_SCHEDULED_SYNC_ENABLED: ${STEAM_SCHEDULED_SYNC_ENABLED:-0}
      STEAM_DEMO_PROVIDER: ${STEAM_DEMO_PROVIDER:-disabled}
      STEAM_DEMO_EXPERIMENTAL_REPLAY_CDN_ENABLED: ${STEAM_DEMO_EXPERIMENTAL_REPLAY_CDN_ENABLED:-0}
      STEAM_DEMO_DOWNLOAD_ALLOWED_HOSTS: ${STEAM_DEMO_DOWNLOAD_ALLOWED_HOSTS:-}
      STEAM_DEMO_DOWNLOAD_MAX_BYTES: ${STEAM_DEMO_DOWNLOAD_MAX_BYTES:-536870912}
      STEAM_DEMO_DOWNLOAD_MAX_REDIRECTS: ${STEAM_DEMO_DOWNLOAD_MAX_REDIRECTS:-3}
      STEAM_DEMO_DOWNLOAD_CONNECT_TIMEOUT_SECONDS: ${STEAM_DEMO_DOWNLOAD_CONNECT_TIMEOUT_SECONDS:-5}
      STEAM_DEMO_DOWNLOAD_READ_TIMEOUT_SECONDS: ${STEAM_DEMO_DOWNLOAD_READ_TIMEOUT_SECONDS:-10}
      STEAM_DEMO_DOWNLOAD_TOTAL_TIMEOUT_SECONDS: ${STEAM_DEMO_DOWNLOAD_TOTAL_TIMEOUT_SECONDS:-60}
      STEAM_DEMO_DOWNLOAD_GLOBAL_CONCURRENCY: ${STEAM_DEMO_DOWNLOAD_GLOBAL_CONCURRENCY:-4}
      STEAM_DEMO_DOWNLOAD_OWNER_CONCURRENCY: ${STEAM_DEMO_DOWNLOAD_OWNER_CONCURRENCY:-1}
      STEAM_DEMO_DOWNLOAD_CONCURRENCY_LEASE_SECONDS: ${STEAM_DEMO_DOWNLOAD_CONCURRENCY_LEASE_SECONDS:-120}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_ALGORITHMS: ${OIDC_ALLOWED_ALGORITHMS:-RS256,ES256}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-__Host-cs2_session}
      AUTH_STATE_COOKIE_NAME: ${AUTH_STATE_COOKIE_NAME:-__Host-cs2_oidc_state}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-3600}
      AUTH_LOGIN_TTL_SECONDS: ${AUTH_LOGIN_TTL_SECONDS:-300}
      AUTH_CLOCK_SKEW_SECONDS: ${AUTH_CLOCK_SKEW_SECONDS:-30}
      ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-local}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-cs2-artifacts-v1}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      ARTIFACT_QUARANTINE_TTL_SECONDS: ${ARTIFACT_QUARANTINE_TTL_SECONDS:-3600}
      MAX_DEMO_UPLOAD_BYTES: ${MAX_DEMO_UPLOAD_BYTES:-1073741824}
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-2147483648}
      MAX_REPLAY_ARTIFACT_BYTES: ${MAX_REPLAY_ARTIFACT_BYTES:-134217728}
      UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-1048576}
      ARTIFACT_STORAGE_ROOT: ${ARTIFACT_STORAGE_ROOT:-/data}
      REPLAY_STORAGE_DIR: ${REPLAY_STORAGE_DIR:-/data/replays}
      DEMO_UPLOAD_STORAGE_DIR: ${DEMO_UPLOAD_STORAGE_DIR:-/data/uploads}
      VIDEO_STORAGE_DIR: ${VIDEO_STORAGE_DIR:-/data/videos}
      SUMMARY_STORAGE_DIR: ${SUMMARY_STORAGE_DIR:-/data/summaries}
      MEDIA_URL_BASE: ${MEDIA_URL_BASE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEV_USER_ID: ${DEV_USER_ID:-dev-user}
      MAX_RENDER_CLIP_SECONDS: ${MAX_RENDER_CLIP_SECONDS:-60}
      RENDER_WORKER_MODE: ${RENDER_WORKER_MODE:-fallback}
      RENDER_WORKER_TOKEN: ${RENDER_WORKER_TOKEN:-dev-render-worker-token}
      RENDER_CLIPS_ENABLED: ${RENDER_CLIPS_ENABLED:-0}
    ports:
      - "8000:8000"
    volumes:
      - artifact-data:/data/artifact-v1
      - replay-data:/data/replays
      - upload-data:/data/uploads
      - video-data:/data/videos
      - summary-data:/data/summaries
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, sys, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); sys.exit(0 if data.get('status') == 'ok' else 1)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: python -m app.workers.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://cs2coach:cs2coach@postgres:5432/cs2coach}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_QUEUE_NAME: ${REDIS_QUEUE_NAME:-cs2-demo-jobs}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      AUTH_MODE: ${AUTH_MODE:-development}
      ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-local}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-cs2-artifacts-v1}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      ARTIFACT_QUARANTINE_TTL_SECONDS: ${ARTIFACT_QUARANTINE_TTL_SECONDS:-3600}
      MAX_DEMO_UPLOAD_BYTES: ${MAX_DEMO_UPLOAD_BYTES:-1073741824}
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-2147483648}
      MAX_REPLAY_ARTIFACT_BYTES: ${MAX_REPLAY_ARTIFACT_BYTES:-134217728}
      UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-1048576}
      ARTIFACT_STORAGE_ROOT: ${ARTIFACT_STORAGE_ROOT:-/data}
      REPLAY_STORAGE_DIR: ${REPLAY_STORAGE_DIR:-/data/replays}
      DEMO_UPLOAD_STORAGE_DIR: ${DEMO_UPLOAD_STORAGE_DIR:-/data/uploads}
      VIDEO_STORAGE_DIR: ${VIDEO_STORAGE_DIR:-/data/videos}
      SUMMARY_STORAGE_DIR: ${SUMMARY_STORAGE_DIR:-/data/summaries}
      MEDIA_URL_BASE: ${MEDIA_URL_BASE:-}
      DEV_USER_ID: ${DEV_USER_ID:-dev-user}
      MAX_RENDER_CLIP_SECONDS: ${MAX_RENDER_CLIP_SECONDS:-60}
      RENDER_WORKER_MODE: ${RENDER_WORKER_MODE:-fallback}
      RENDER_WORKER_TOKEN: ${RENDER_WORKER_TOKEN:-dev-render-worker-token}
    volumes:
      - artifact-data:/data/artifact-v1
      - replay-data:/data/replays
      - upload-data:/data/uploads
      - video-data:/data/videos
      - summary-data:/data/summaries
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_AUTH_PROVIDER: ${AUTH_PROVIDER:-steam}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  artifact-data:
  replay-data:
  upload-data:
  video-data:
  summary-data:
