# Parse-queue, background-recompute, replay-cache and render-queue tuning, read
# by backend/app/core/config.py. Compose `--env-file` only feeds `${}`
# interpolation, so a setting that is not listed in a service's `environment:`
# never reaches the container. Merged into both api and worker: some are read on
# one side only, and the two shared ones (REPLAY_READY_CHANNEL,
# REPLAY_WARM_ENABLED) must agree. The fallbacks repeat the code defaults;
# backend/tests/test_compose_passthrough.py keeps the two in step and fails when
# a new config.py setting is neither passed through nor allow-listed.
x-worker-tuning: &worker-tuning
  PARSE_TIMEOUT_SECONDS: ${PARSE_TIMEOUT_SECONDS:-1200}
  PARSE_MEMORY_LIMIT_BYTES: ${PARSE_MEMORY_LIMIT_BYTES:-4294967296}
  PARSE_LEASE_TTL_SECONDS: ${PARSE_LEASE_TTL_SECONDS:-60}
  PARSE_LEASE_RENEW_SECONDS: ${PARSE_LEASE_RENEW_SECONDS:-15}
  PARSE_RECLAIM_AFTER_SECONDS: ${PARSE_RECLAIM_AFTER_SECONDS:-1800}
  PARSE_REDISPATCH_AFTER_SECONDS: ${PARSE_REDISPATCH_AFTER_SECONDS:-300}
  PARSE_MAX_ATTEMPTS: ${PARSE_MAX_ATTEMPTS:-3}
  REPLAY_UPGRADE_ENABLED: ${REPLAY_UPGRADE_ENABLED:-1}
  REPLAY_UPGRADE_MAX_ATTEMPTS: ${REPLAY_UPGRADE_MAX_ATTEMPTS:-3}
  REPLAY_UPGRADE_RETRY_SECONDS: ${REPLAY_UPGRADE_RETRY_SECONDS:-900}
  COACHING_RECOMPUTE_ENABLED: ${COACHING_RECOMPUTE_ENABLED:-1}
  COACHING_RECOMPUTE_MAX_ATTEMPTS: ${COACHING_RECOMPUTE_MAX_ATTEMPTS:-3}
  COACHING_RECOMPUTE_RETRY_SECONDS: ${COACHING_RECOMPUTE_RETRY_SECONDS:-900}
  REPLAY_RESPONSE_CACHE_MB: ${REPLAY_RESPONSE_CACHE_MB:-64}
  REPLAY_WARM_ENABLED: ${REPLAY_WARM_ENABLED:-1}
  REPLAY_WARM_RECENT: ${REPLAY_WARM_RECENT:-10}
  REPLAY_READY_CHANNEL: ${REPLAY_READY_CHANNEL:-cs2:replay-ready}
  RENDER_CLIP_QUEUE_TIMEOUT_SECONDS: ${RENDER_CLIP_QUEUE_TIMEOUT_SECONDS:-1800}
  RENDER_CLIP_SINGLE_CONSUMER: ${RENDER_CLIP_SINGLE_CONSUMER:-1}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cs2coach}
      POSTGRES_USER: ${POSTGRES_USER:-cs2coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs2coach}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cs2coach} -d ${POSTGRES_DB:-cs2coach}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *worker-tuning
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://cs2coach:cs2coach@postgres:5432/cs2coach}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_QUEUE_NAME: ${REDIS_QUEUE_NAME:-cs2-demo-jobs}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      AUTH_MODE: ${AUTH_MODE:-development}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-steam}
      STEAM_AUTH_STATE_COOKIE_NAME: ${STEAM_AUTH_STATE_COOKIE_NAME:-__Host-cs2_steam_state}
      STEAM_OPENID_NONCE_TTL_SECONDS: ${STEAM_OPENID_NONCE_TTL_SECONDS:-600}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      STEAM_LOGIN_ALLOWLIST: ${STEAM_LOGIN_ALLOWLIST:-}
      STEAM_CREDENTIAL_ENCRYPTION_KEY: ${STEAM_CREDENTIAL_ENCRYPTION_KEY:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
      STEAM_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${STEAM_CREDENTIAL_ENCRYPTION_KEY_VERSION:-dev-v1}
      STEAM_SYNC_MAX_MATCHES: ${STEAM_SYNC_MAX_MATCHES:-20}
      STEAM_SYNC_TIMEOUT_SECONDS: ${STEAM_SYNC_TIMEOUT_SECONDS:-5}
      STEAM_SYNC_RETRY_BASE_SECONDS: ${STEAM_SYNC_RETRY_BASE_SECONDS:-30}
      STEAM_SYNC_RETRY_MAX_SECONDS: ${STEAM_SYNC_RETRY_MAX_SECONDS:-3600}
      STEAM_SCHEDULED_SYNC_ENABLED: ${STEAM_SCHEDULED_SYNC_ENABLED:-0}
      STEAM_DEMO_PROVIDER: ${STEAM_DEMO_PROVIDER:-disabled}
      STEAM_DEMO_EXPERIMENTAL_REPLAY_CDN_ENABLED: ${STEAM_DEMO_EXPERIMENTAL_REPLAY_CDN_ENABLED:-0}
      STEAM_DEMO_DOWNLOAD_ALLOWED_HOSTS: ${STEAM_DEMO_DOWNLOAD_ALLOWED_HOSTS:-}
      STEAM_DEMO_DOWNLOAD_MAX_BYTES: ${STEAM_DEMO_DOWNLOAD_MAX_BYTES:-536870912}
      STEAM_DEMO_DOWNLOAD_MAX_REDIRECTS: ${STEAM_DEMO_DOWNLOAD_MAX_REDIRECTS:-3}
      STEAM_DEMO_DOWNLOAD_CONNECT_TIMEOUT_SECONDS: ${STEAM_DEMO_DOWNLOAD_CONNECT_TIMEOUT_SECONDS:-5}
      STEAM_DEMO_DOWNLOAD_READ_TIMEOUT_SECONDS: ${STEAM_DEMO_DOWNLOAD_READ_TIMEOUT_SECONDS:-10}
      STEAM_DEMO_DOWNLOAD_TOTAL_TIMEOUT_SECONDS: ${STEAM_DEMO_DOWNLOAD_TOTAL_TIMEOUT_SECONDS:-60}
      STEAM_DEMO_DOWNLOAD_GLOBAL_CONCURRENCY: ${STEAM_DEMO_DOWNLOAD_GLOBAL_CONCURRENCY:-4}
      STEAM_DEMO_DOWNLOAD_OWNER_CONCURRENCY: ${STEAM_DEMO_DOWNLOAD_OWNER_CONCURRENCY:-1}
      STEAM_DEMO_DOWNLOAD_CONCURRENCY_LEASE_SECONDS: ${STEAM_DEMO_DOWNLOAD_CONCURRENCY_LEASE_SECONDS:-120}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_ALGORITHMS: ${OIDC_ALLOWED_ALGORITHMS:-RS256,ES256}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-0}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-__Host-cs2_session}
      AUTH_STATE_COOKIE_NAME: ${AUTH_STATE_COOKIE_NAME:-__Host-cs2_oidc_state}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-3600}
      AUTH_SESSION_MAX_AGE_SECONDS: ${AUTH_SESSION_MAX_AGE_SECONDS:-86400}
      AUTH_LOGIN_TTL_SECONDS: ${AUTH_LOGIN_TTL_SECONDS:-300}
      AUTH_CLOCK_SKEW_SECONDS: ${AUTH_CLOCK_SKEW_SECONDS:-30}
      ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-local}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-cs2-artifacts-v1}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      ARTIFACT_QUARANTINE_TTL_SECONDS: ${ARTIFACT_QUARANTINE_TTL_SECONDS:-3600}
      MAX_DEMO_UPLOAD_BYTES: ${MAX_DEMO_UPLOAD_BYTES:-1073741824}
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-2147483648}
      MAX_REPLAY_ARTIFACT_BYTES: ${MAX_REPLAY_ARTIFACT_BYTES:-134217728}
      UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-1048576}
      # Chunked .dem upload sessions: parts staged on the upload-staging volume
      # until `complete` hands them to the normal intake (docs/api_reference_v1.md).
      UPLOAD_STAGING_ROOT: ${UPLOAD_STAGING_ROOT:-/data/upload-staging}
      UPLOAD_PART_BYTES: ${UPLOAD_PART_BYTES:-8388608}
      UPLOAD_MAX_PARALLEL_PARTS: ${UPLOAD_MAX_PARALLEL_PARTS:-4}
      UPLOAD_PART_POOL: ${UPLOAD_PART_POOL:-8}
      UPLOAD_SESSION_TTL_SECONDS: ${UPLOAD_SESSION_TTL_SECONDS:-86400}
      UPLOAD_SESSION_GLOBAL_LIMIT: ${UPLOAD_SESSION_GLOBAL_LIMIT:-6}
      UPLOAD_STAGING_MIN_FREE_BYTES: ${UPLOAD_STAGING_MIN_FREE_BYTES:-5368709120}
      DEMO_UPLOAD_DAILY_LIMIT: ${DEMO_UPLOAD_DAILY_LIMIT:-10}
      DEMO_ACTIVE_PARSE_LIMIT: ${DEMO_ACTIVE_PARSE_LIMIT:-2}
      PARSE_QUEUE_GLOBAL_LIMIT: ${PARSE_QUEUE_GLOBAL_LIMIT:-50}
      ARTIFACT_STORAGE_ROOT: ${ARTIFACT_STORAGE_ROOT:-/data}
      REPLAY_STORAGE_DIR: ${REPLAY_STORAGE_DIR:-/data/replays}
      DEMO_UPLOAD_STORAGE_DIR: ${DEMO_UPLOAD_STORAGE_DIR:-/data/uploads}
      VIDEO_STORAGE_DIR: ${VIDEO_STORAGE_DIR:-/data/videos}
      SUMMARY_STORAGE_DIR: ${SUMMARY_STORAGE_DIR:-/data/summaries}
      MEDIA_URL_BASE: ${MEDIA_URL_BASE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEV_USER_ID: ${DEV_USER_ID:-dev-user}
      MAX_RENDER_CLIP_SECONDS: ${MAX_RENDER_CLIP_SECONDS:-60}
      RENDER_WORKER_MODE: ${RENDER_WORKER_MODE:-fallback}
      RENDER_WORKER_TOKEN: ${RENDER_WORKER_TOKEN:-dev-render-worker-token}
      RENDER_CLIPS_ENABLED: ${RENDER_CLIPS_ENABLED:-0}
    ports:
      - "8000:8000"
    volumes:
      - artifact-data:/data/artifact-v1
      - replay-data:/data/replays
      - upload-data:/data/uploads
      - video-data:/data/videos
      - summary-data:/data/summaries
      - upload-staging:/data/upload-staging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, sys, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); sys.exit(0 if data.get('status') == 'ok' else 1)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: python -m app.workers.worker
    environment:
      <<: *worker-tuning
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://cs2coach:cs2coach@postgres:5432/cs2coach}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_QUEUE_NAME: ${REDIS_QUEUE_NAME:-cs2-demo-jobs}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:3000}
      AUTH_MODE: ${AUTH_MODE:-development}
      ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-local}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-cs2-artifacts-v1}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      ARTIFACT_QUARANTINE_TTL_SECONDS: ${ARTIFACT_QUARANTINE_TTL_SECONDS:-3600}
      MAX_DEMO_UPLOAD_BYTES: ${MAX_DEMO_UPLOAD_BYTES:-1073741824}
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-2147483648}
      MAX_REPLAY_ARTIFACT_BYTES: ${MAX_REPLAY_ARTIFACT_BYTES:-134217728}
      UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-1048576}
      # The worker's hourly maintenance sweeps expired upload sessions and
      # orphaned staging directories on the same volume as the API.
      UPLOAD_STAGING_ROOT: ${UPLOAD_STAGING_ROOT:-/data/upload-staging}
      ARTIFACT_STORAGE_ROOT: ${ARTIFACT_STORAGE_ROOT:-/data}
      REPLAY_STORAGE_DIR: ${REPLAY_STORAGE_DIR:-/data/replays}
      DEMO_UPLOAD_STORAGE_DIR: ${DEMO_UPLOAD_STORAGE_DIR:-/data/uploads}
      VIDEO_STORAGE_DIR: ${VIDEO_STORAGE_DIR:-/data/videos}
      SUMMARY_STORAGE_DIR: ${SUMMARY_STORAGE_DIR:-/data/summaries}
      MEDIA_URL_BASE: ${MEDIA_URL_BASE:-}
      DEV_USER_ID: ${DEV_USER_ID:-dev-user}
      MAX_RENDER_CLIP_SECONDS: ${MAX_RENDER_CLIP_SECONDS:-60}
      RENDER_WORKER_MODE: ${RENDER_WORKER_MODE:-fallback}
      RENDER_WORKER_TOKEN: ${RENDER_WORKER_TOKEN:-dev-render-worker-token}
      # The demo parser child runs as this unprivileged user when the worker
      # runs as root on POSIX. Unset means the image's `parser` user; set it
      # empty to keep the child on the worker's own user.
      PARSE_CHILD_USER: ${PARSE_CHILD_USER-parser}
    volumes:
      - artifact-data:/data/artifact-v1
      - replay-data:/data/replays
      - upload-data:/data/uploads
      - video-data:/data/videos
      - summary-data:/data/summaries
      - upload-staging:/data/upload-staging
    # Healthy while the worker's Redis heartbeat is fresh (renewed every loop
    # and during a parse). No service depends on it, so a stuck worker never
    # takes the site down; GET /health/worker reports the same signal. Probed
    # every 5 s during the start period so `up --wait` is not held for 30 s.
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    # A production build served by `next start`. The source is baked into the image (no volume), so
    # a dev server gave no hot reload here, only on-demand compiles and React's 2-5x slower
    # development build. For live editing, run `npm run dev` in frontend/ instead (see README).
    # NEXT_PUBLIC_* values are bundled at build time: rebuild after changing them.
    build:
      context: ./frontend
      dockerfile: Dockerfile.preview
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_PROVIDER: ${AUTH_PROVIDER:-steam}
    command: npm run start -- --hostname 0.0.0.0 --port 3000
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_AUTH_PROVIDER: ${AUTH_PROVIDER:-steam}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  artifact-data:
  replay-data:
  upload-data:
  video-data:
  summary-data:
  # Parts of unfinished chunked uploads (API writes, API and worker sweep).
  # Kept across deploys so an interrupted upload resumes; up to
  # UPLOAD_SESSION_GLOBAL_LIMIT x MAX_DEMO_UPLOAD_BYTES.
  upload-staging:
