# Production override for one VPS behind Caddy (docs/vps_deploy_v1.md).
# Apply on top of the base and preview files, always in this order:
#
#   docker compose --env-file deploy/.env.production \
#     -f docker-compose.yml -f docker-compose.preview.yml -f docker-compose.prod.yml up -d
#
# Requires Docker Compose >= 2.24 for the `!reset` tag. Caddy is the only
# published service; api and frontend are reachable solely on the private
# compose network. Artifacts live in the S3-compatible bucket the preview
# override already requires; the base local artifact volumes stay declared but
# production does not rely on them. The one exception is the base file's
# `upload-staging` volume (api and worker): the parts of unfinished chunked
# uploads wait on this host's disk until `complete` moves them to the bucket.
#
# Networks: postgres and redis sit only on `backend`, an internal network with
# no route out; api and worker join it and the default network (they need
# outbound HTTPS to R2 and Steam); caddy and frontend stay on the default
# network only, so the public-facing containers cannot reach the database or
# Redis at all. Redis also requires REDIS_PASSWORD (set up in the preview file,
# which every production-auth shape uses): sessions live there unsigned, so
# write access would mint a session for any user.
#
# Images are per commit: scripts/deploy/deploy.sh exports DEPLOY_SHA, which
# names cs2coach-backend:<sha> (one image for api and worker) and
# cs2coach-frontend:<sha>, so a rollback whose images still exist starts them
# without a build. Unset, the tag is `latest`, which deploy.sh moves to every
# deploy that passed, so maintenance commands (`compose exec`, restore.sh's
# `up -d api worker`) need no DEPLOY_SHA and start the deployed images.
name: cs2coach

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to the public host name, e.g. coach.example.com}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for the Let's Encrypt account}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    logging: *default-logging

  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (hex, e.g. openssl rand -hex 24); production has no default}
    networks:
      - backend
    logging: *default-logging

  redis:
    restart: unless-stopped
    # Append-only persistence keeps sign-in sessions and queued jobs across
    # restarts. This replaces the preview command, so it repeats the password
    # (the preview file also sets REDISCLI_AUTH, the healthcheck and REDIS_URL).
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD (hex, e.g. openssl rand -hex 24); production has no default}
    volumes:
      - redis-data:/data
    networks:
      - backend
    logging: *default-logging

  api:
    image: cs2coach-backend:${DEPLOY_SHA:-latest}
    restart: unless-stopped
    # One uvicorn process on purpose (the in-process upload slot relies on it).
    # Forwarded client IPs are trusted from any peer only because this port is
    # not published: the sole peer is Caddy, which overwrites X-Forwarded-For.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --timeout-keep-alive
      - "75"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cs2coach}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cs2coach}
    ports: !reset []
    networks:
      - default
      - backend
    logging: *default-logging

  worker:
    image: cs2coach-backend:${DEPLOY_SHA:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cs2coach}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cs2coach}
    # A runaway parse is killed inside the worker's cgroup (recorded as
    # PARSE_OUT_OF_MEMORY) instead of pushing the whole VPS into swap. Equal
    # limits mean no swap for the worker. Size it below the VPS RAM minus
    # postgres, redis, api, frontend and caddy (deploy/env.production.example).
    mem_limit: ${WORKER_MEM_LIMIT:-3g}
    memswap_limit: ${WORKER_MEM_LIMIT:-3g}
    networks:
      - default
      - backend
    logging: *default-logging

  frontend:
    image: cs2coach-frontend:${DEPLOY_SHA:-latest}
    restart: unless-stopped
    command:
      - npm
      - run
      - start
      - --
      - --hostname
      - 0.0.0.0
      - --port
      - "3000"
      - --keepAliveTimeout
      - "75000"
    ports: !reset []
    logging: *default-logging

networks:
  backend:
    internal: true

volumes:
  redis-data:
  caddy_data:
  caddy_config:
