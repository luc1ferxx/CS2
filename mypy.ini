# mypy configuration - CS2 Demo AI Coach
#
# Run from the repository root with no arguments: `mypy`.
#
# NOTE: keep this file pure ASCII. mypy reads .ini files with the interpreter's
# locale encoding, so a non-ASCII byte here crashes mypy on any Windows machine
# whose console codepage is not UTF-8 (e.g. GBK).
#
# Design rule, same as ruff.toml: this must be green on `main`. A type checker
# that reports pre-existing errors on every run teaches everyone to ignore it.

[mypy]
python_version = 3.12
mypy_path = backend
files = backend/app
namespace_packages = True
explicit_package_bases = True

# Diagnostics that catch real mistakes without demanding full annotations.
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True

# Keep output actionable.
show_error_codes = True

# demoparser2 is a Rust extension with no stubs; boto3/botocore/pandas ship
# partial or no type information. Their absence is not a defect in this code.
[mypy-demoparser2.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

# ---------------------------------------------------------------------------
# Recorded debt: 99 errors across the 9 modules below.
#
# 49 of the 58 modules under backend/app are fully checked. The 9 here are
# listed individually, with counts, rather than hidden behind one blanket
# switch: each line is a unit of work someone can pick up and delete.
#
# ROOT CAUSE, and the cheapest way to retire most of this: 55 of the 99 errors
# (56%) come from parameters annotated as a bare `object` -- `redis_client:
# object`, `http_client: object = httpx`, `jwks: object`, `sock: object`,
# `headers: object`, `clock: object = time.time`. `object` was used as an
# escape hatch to avoid naming a real type, but it is the WIDEST type there is,
# so every later `.eval(...)`, `.get(...)` or `clock()` on that value is an
# error by construction. These are not latent bugs; the runtime objects are
# fine. Replacing each with a narrow typing.Protocol naming only the methods
# actually called -- the pattern already applied in services/steam_sync_rate_limit.py
# and services/steam_match_service.py -- clears them without touching behavior.
#
# The other 44 are ordinary findings (arg-type, union-attr) and should be read
# one at a time. services/demo_service.py is the outlier at 24; it is also the
# largest module in the backend and is already slated for decomposition.
#
# To work on one: delete its stanza, run `mypy`, fix what appears. Do not
# add a module here without a count and a reason.
# ---------------------------------------------------------------------------

[mypy-app.services.demo_service]
# 24 errors, the largest single block. 10 of them are ONE root cause: the
# `ArtifactStoreProtocol` declares `read_range(...) -> ArtifactReadProtocol`
# while the concrete `ArtifactStore.read_range` returns `ArtifactRead`, so every
# call site that passes a real store is rejected (lines 144, 996, 1052, 1504,
# 1562, 1664, 1914, 1999, 2028, 2315). Aligning those two return types retires
# 10 errors in one edit. 3 more come from bare `object` params; the remaining 11
# are ordinary findings. This module is also already slated for decomposition.
ignore_errors = True

[mypy-app.services.secure_demo_downloader]
# 13 errors, 11 from bare `object` params
ignore_errors = True

[mypy-app.services.steam_demo_import_service]
# 13 errors, all 13 from bare `object` params
ignore_errors = True

[mypy-app.services.steam_auth_service]
