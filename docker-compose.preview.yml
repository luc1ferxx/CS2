# Preview override for a built frontend image.
# Set NEXT_PUBLIC_API_BASE_URL, BACKEND_PUBLIC_URL, CORS_ORIGINS, and MEDIA_URL_BASE
# to public origins before building for a hosted preview.
services:
  api:
    environment:
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      MEDIA_URL_BASE: ${MEDIA_URL_BASE:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

  worker:
    environment:
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      MEDIA_URL_BASE: ${MEDIA_URL_BASE:-http://localhost:8000}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.preview
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    command: npm run start -- --hostname 0.0.0.0 --port 3000
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
