# CI for CS2 Demo AI Coach
#
# Why this file exists: before it, the only proof that the suite passed was a
# human running scripts/verify.sh in a one-off container and pasting the count
# into a document. That made platform-specific defects invisible for as long as
# nobody happened to test on the other OS.
#
# Design rules:
#
#  1. Every job here MUST be green on `main`. A red default branch trains people
#     to ignore CI, and then it catches nothing. New checks arrive already
#     passing, or with their debt written down (see ruff.toml and mypy.ini).
#  2. Jobs are independent -- none declares `needs` -- so one failure does not
#     mask the others. A contributor sees every problem in a single run.
#  3. Versions are pinned (Python, Node, ruff, mypy). An unpinned tool turns
#     `main` red without anybody changing a line of code.
#
# The backend suite runs against sqlite:///:memory:, so no Postgres or Redis
# service container is needed. render-worker imports only the standard library,
# so its job installs nothing at all.
#
# Backend packages come from backend/requirements.lock: every package, direct
# or transitive, pinned with its hashes for Linux / CPython 3.12, the same file
# backend/Dockerfile installs. backend/requirements.txt stays the hand-edited
# input; the lock's header holds the `uv pip compile` command that regenerates
# it. pip refuses to mix hashed and unhashed requirements in one command, so the
# dev tools (requirements-dev.txt) install in a separate step.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run. Keeps the queue short
# without dropping runs on `main`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements.lock

      # Cheap syntax gate: fails in seconds on a broken file instead of surfacing
      # as a confusing import error partway through discovery.
      - name: Byte-compile
        run: python -m compileall -q backend

      - name: Run tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover backend/tests --verbose

  render-worker-tests:
    name: render-worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # No install step on purpose: render-worker imports only the standard
      # library. If a dependency ever creeps in, this job is where it surfaces.
      - name: Run tests
        run: python -m unittest discover render-worker/tests --verbose

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # CI should not report telemetry. This also keeps `next build` from
      # writing its config file into the runner's home directory, which fails
      # on any host where that path is redirected onto another volume.
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The files in lib/*.test.mjs are plain node scripts that assert with
      # node:assert -- there is no test runner to aggregate them. Looping with
      # `set -e` would stop at the first failure, so instead every file runs and
      # the failures are reported together.
      - name: Unit tests
        run: |
          failed=""
          for f in lib/*.test.mjs; do
            echo "::group::$f"
            if node "$f"; then
              echo "PASS $f"
            else
              echo "FAIL $f"
              failed="$failed $f"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failing frontend test files:$failed"
            exit 1
          fi
          echo "All frontend test files passed."

      # Component and page tests (Vitest + Testing Library on jsdom). These
      # mount the real dashboard and demo-detail pages against a mocked API
      # client, so the state machines the pure helper tests cannot see --
      # polling, loading, failure verdicts -- are checked here. Pinned in
      # frontend/package.json; configuration in frontend/vitest.config.ts.
      - name: Component tests
        run: npm test

      - name: Build
        run: npm run build

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      # Configuration and rule rationale live in ruff.toml.
      - name: ruff check
        run: ruff check --output-format=github .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            requirements-dev.txt

      # mypy needs the runtime packages present to resolve FastAPI, SQLAlchemy
      # and Pydantic types. Without them it degrades to Any and stops finding
      # anything useful, so this job installs the full backend lock.
      - name: Install dependencies and tooling
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements.lock
          pip install -r requirements-dev.txt

      # Scope and per-module debt live in mypy.ini.
      - name: mypy
        run: mypy

  # The deploy kit only ever runs on the production VPS, so this is the one
  # place its bash and the stacked production compose shape get checked before
  # a deploy does it for real. No Python or Node needed.
  deploy-kit:
    name: Deploy scripts and compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: bash -n
        run: |
          failed=""
          for f in scripts/*.sh scripts/deploy/*.sh; do
            bash -n "$f" || failed="$failed $f"
          done
          if [ -n "$failed" ]; then
            echo "::error::bash syntax errors in:$failed"
            exit 1
          fi

      # Pinned image rather than the runner's apt package, for the same reason
      # ruff and mypy are pinned. Accepted findings live in .shellcheckrc.
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            -x scripts/*.sh scripts/deploy/*.sh

      # Renders every compose shape the docs use without starting anything.
      # The production shape needs Compose >= 2.24 (`!reset`) and reads the
      # checked-in example env, so its CHANGE_ME placeholders must satisfy
      # every `${VAR:?}` the stacked files require.
      - name: docker compose config
        run: |
          docker compose version
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose --env-file deploy/env.production.example \
            -f docker-compose.yml -f docker-compose.preview.yml config -q
          docker compose --env-file deploy/env.production.example \
            -f docker-compose.yml -f docker-compose.preview.yml -f docker-compose.prod.yml config -q
